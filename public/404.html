<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecionando...</title>
    <script type="text/javascript">
      // GitHub Pages SPA router redirect
      var pathName = window.location.pathname;
      if (pathName.endsWith('/download') || pathName.endsWith('/download/')) {
        window.location.replace(window.location.origin + window.location.search + '/#/download');
      } else {
        // Redirect any other unknown routes to root hash route
        window.location.replace(window.location.origin + '/#' + pathName);
      }
    </script>
  </head>
  <body>
    Redirecionando...
  </body>
</html>
