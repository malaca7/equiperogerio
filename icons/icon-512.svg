<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Dynamic modern gradient background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00947e" />
      <stop offset="100%" stop-color="#004d40" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Stylized premium "7L" icon -->
  <g filter="url(#glow)">
    <!-- Diagonal futuristic cut for "7" -->
    <path d="M160 140 H360 L240 380 H170 L275 190 H160 V140 Z" fill="url(#logoGrad)" />
    <!-- Sleek interlocking "L" -->
    <path d="M220 280 H280 L230 380 H360 V410 H170 L220 280 Z" fill="#26a69a" opacity="0.9" />
  </g>
</svg>
